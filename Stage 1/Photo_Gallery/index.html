<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:Arial,sans-serif;

    background:#f4f4f4;

    color:#222;

}



.gallery-container{

    max-width:1100px;

    margin:auto;

    padding:20px;

}



/* HEADER */

#top_section{

    background:
    linear-gradient(160deg,#858585 50%,#fc2525);

    color:white;

    text-align:center;

    padding:50px 20px;

    border-radius:15px;

    margin-bottom:30px;

}


#top_section h1{

    font-size:40px;

    margin-bottom:10px;

}



/* GALLERY */

#bottom_bottom_section{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:25px;

}



/* CARD */

.card{

    background:white;

    border-radius:15px;

    overflow:hidden;


    box-shadow:
    0 5px 15px rgba(0,0,0,.1);


    transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    box-shadow .35s ease;

}


.card:hover{

    transform:translateY(-10px);

    box-shadow:
    0 20px 40px rgba(0,0,0,.2);

    cursor:pointer;

}



.card img{

    width:100%;

    height:250px;

    object-fit:cover;

    display:block;

}



/* BIG CARD */


.feature{

    margin-bottom:25px;

}


.feature img{

    height:500px;

    object-position:center;

}



/* FULL BODY */

.full img{

    height:500px;

    object-fit:contain;

    background:#eee;

}



/* CAPTION */

.caption{

    padding:20px;

}


.caption h3{

    display:inline-block;

    position:relative;

}


.caption h3::after{


    content:"";

    position:absolute;


    left:0;

    bottom:-6px;


    width:0;

    height:3px;


    background:#fc2525;


    border-radius:5px;


    transition:.35s ease;

}



.card:hover h3::after{

    width:100%;

}

.bust img{

    height:250px;

    width:100%;

    object-fit:cover;

    object-position:top;

}


/* MOBILE */

@media(max-width:700px){


    #bottom_bottom_section{

        grid-template-columns:1fr;

    }


    #top_section h1{

        font-size:30px;

    }


}



</style>


</head>


<body>


<div class="gallery-container">


<div id="top_section">

<h1>Photo Gallery</h1>

<p>Explore the Audi drivers views.</p>

</div>




<div class="feature card">

<img src="driversTogether.webp" alt="drivers together">

<div class="caption">

<h3>Nico and Bortoleto</h3>

</div>

</div>




<div id="bottom_bottom_section">


<div class="card bust">
    <img src="bbust.png" alt="bortoleto bust">

    <div class="caption">
        <h3>Bortoleto Bust</h3>
    </div>
</div>


<div class="card bust">
    <img src="hbust.png" alt="hulkenberg bust">

    <div class="caption">
        <h3>Hulkenberg Bust</h3>
    </div>
</div>





<div class="card full">

<img src="bortoleto.png" alt="bortoleto">

<div class="caption">

<h3>Bortoleto Full Body</h3>

</div>

</div>





<div class="card full">

<img src="hulkenberg.png" alt="hulkenberg">

<div class="caption">

<h3>Hulkenberg Full Body</h3>

</div>

</div>


</div>


</div>


</body>
</html>
