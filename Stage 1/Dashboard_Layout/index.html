<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Layout</title>

</head>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:Arial, sans-serif;

    background:#f4f6f8;

    color:#222;

}



/* DASHBOARD */

#dashboard{

    width:90%;

    max-width:1400px;

    margin:40px auto;

}



/* TOP SECTION */

#top_sec{

    display:grid;

    grid-template-columns:1fr 1.5fr;

    gap:25px;

    margin-bottom:40px;

}



/* STAT CARDS */

#stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}



.stat_card{

    background:white;

    padding:25px;

    border-radius:15px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);

    transition:.3s ease;

}



.stat_card:hover{

    transform:translateY(-5px);

    box-shadow:
    0 15px 30px rgba(0,0,0,.12);

}



.stat_card h3{

    font-size:16px;

    color:#777;

    margin-bottom:15px;

}



.stat_card p{

    font-size:32px;

    font-weight:bold;

}





/* CHART */

#chart{

    background:white;

    border-radius:15px;

    padding:25px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);

}



#chart h2{

    margin-bottom:20px;

}



.chart_placeholder{

    height:300px;

    background:#eef1f5;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#999;

    font-size:30px;

}




/* TABLE SECTION */


#bottom_sec{

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.08);

}



#bottom_sec h2{

    margin-bottom:25px;

}





table{

    width:100%;

    border-collapse:collapse;

}



th{

    text-align:left;

    background:#f1f3f5;

    padding:15px;

    color:#555;

}



td{

    padding:15px;

    border-bottom:1px solid #eee;

}



tr{

    transition:.2s ease;

}



tbody tr:hover{

    background:#f8f9fa;

}




/* STATUS STYLE */

td:nth-child(4){

    color:green;

    font-weight:bold;

}




/* MOBILE */

@media(max-width:900px){


    #top_sec{

        grid-template-columns:1fr;

    }



}



@media(max-width:600px){


    #dashboard{

        width:95%;

    }


    #stats{

        grid-template-columns:1fr;

    }


    table{

        font-size:14px;

    }


    th,td{

        padding:10px;

    }


}


</style>

<body>


<main id="dashboard">


    <!-- TOP SECTION -->

    <section id="top_sec">


        <!-- Statistics Cards -->

        <div id="stats">


            <div class="stat_card">

                <h3>Active Users</h3>

                <p>12,540</p>

            </div>



            <div class="stat_card">

                <h3>Active Subscribers</h3>

                <p>4,320</p>

            </div>



            <div class="stat_card">

                <h3>Traffic</h3>

                <p>86.4K</p>

            </div>



            <div class="stat_card">

                <h3>Revenue</h3>

                <p>$24,580</p>

            </div>


        </div>



        <!-- Chart -->

        <div id="chart">

            <h2>Traffic Overview</h2>

            <div class="chart_placeholder">

                CHART

            </div>


        </div>


    </section>




    <!-- BOTTOM SECTION -->


    <section id="bottom_sec">


        <h2>
            Recent Subscribers
        </h2>



        <table>


            <thead>

                <tr>

                    <th>Username</th>

                    <th>Plan</th>

                    <th>Payment Method</th>

                    <th>Status</th>

                    <th>Joined</th>

                </tr>

            </thead>



            <tbody>


                <tr>

                    <td>Adrian</td>

                    <td>Pro</td>

                    <td>Card</td>

                    <td>Active</td>

                    <td>July 2026</td>

                </tr>


                <tr>

                    <td>John</td>

                    <td>Basic</td>

                    <td>PayPal</td>

                    <td>Active</td>

                    <td>June 2026</td>

                </tr>


                <tr>

                    <td>Maria</td>

                    <td>Business</td>

                    <td>Card</td>

                    <td style="color: red;">Inactive</td>

                    <td>May 2026</td>

                </tr>


            </tbody>


        </table>


    </section>



</main>


</body>

</html>
