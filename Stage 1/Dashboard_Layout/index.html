<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Layout</title>

    <link rel="stylesheet" href="styles.css">

</head>

    

<body>


<main id="dashboard">


    <!-- TOP SECTION -->

    <section id="top_sec">


        <!-- Statistics Cards -->

        <div id="stats">


            <div class="stat_card">

                <h3>Active Users</h3>

                <p>12,540</p>

            </div>



            <div class="stat_card">

                <h3>Active Subscribers</h3>

                <p>4,320</p>

            </div>



            <div class="stat_card">

                <h3>Traffic</h3>

                <p>86.4K</p>

            </div>



            <div class="stat_card">

                <h3>Revenue</h3>

                <p>$24,580</p>

            </div>


        </div>



        <!-- Chart -->

        <div id="chart">

            <h2>Traffic Overview</h2>

            <div class="chart_placeholder">

                CHART

            </div>


        </div>


    </section>




    <!-- BOTTOM SECTION -->


    <section id="bottom_sec">


        <h2>
            Recent Subscribers
        </h2>



        <table>


            <thead>

                <tr>

                    <th>Username</th>

                    <th>Plan</th>

                    <th>Payment Method</th>

                    <th>Status</th>

                    <th>Joined</th>

                </tr>

            </thead>



            <tbody>


                <tr>

                    <td>Adrian</td>

                    <td>Pro</td>

                    <td>Card</td>

                    <td>Active</td>

                    <td>July 2026</td>

                </tr>


                <tr>

                    <td>John</td>

                    <td>Basic</td>

                    <td>PayPal</td>

                    <td>Active</td>

                    <td>June 2026</td>

                </tr>


                <tr>

                    <td>Maria</td>

                    <td>Business</td>

                    <td>Card</td>

                    <td style="color: red;">Inactive</td>

                    <td>May 2026</td>

                </tr>


            </tbody>


        </table>


    </section>



</main>


</body>

</html>
