<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/b160e75569.js" crossorigin="anonymous"></script>

<title>Navigation Bar</title>

    <link rel="stylesheet" href="styles.css">




</head>


<body>


<nav id="nav_bar">


<button id="hamburger_Btn">

<i class="fa-solid fa-bars"></i>

</button>



<div id="links">


<a href="#">Home</a>

<a href="#">About</a>

<a href="#">Services</a>

<a href="#">Contact</a>

<a href="#">Profile</a>


</div>


</nav>




<script>


// Get hamburger button

const hamburger_Btn = document.getElementById("hamburger_Btn");


// Get navigation links

const links = document.getElementById("links");


// Get hamburger icon

const icon = hamburger_Btn.querySelector("i");




// Open and close menu

hamburger_Btn.addEventListener("click",()=>{


    links.classList.toggle("open");


    // Change hamburger icon

    if(links.classList.contains("open")){


        icon.classList.remove("fa-bars");

        icon.classList.add("fa-xmark");


    }

    else{


        icon.classList.remove("fa-xmark");

        icon.classList.add("fa-bars");


    }



});



</script>


</body>
</html>
