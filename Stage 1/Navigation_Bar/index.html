<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/b160e75569.js" crossorigin="anonymous"></script>

<title>Navigation Bar</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:"Google Sans", sans-serif;

}


/* NAVBAR */

#nav_bar{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:50px;

    background:lightslategray;

    display:flex;

    justify-content:flex-end;

    align-items:center;

    padding:0 20px;

    z-index:100;

}



/* LINKS */

#links{

    display:flex;

    gap:25px;

}



#links a{

    color:white;

    text-decoration:none;

    position:relative;

    transition:.25s ease;

}



#links a:hover{

    color:#d8d8d8;

}


/* UNDERLINE */

#links a::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-5px;

    width:0;

    height:2px;

    background:white;

    transition:.3s ease;

}


#links a:hover::after{

    width:100%;

}




/* HAMBURGER */


#hamburger_Btn{

    display:none;

    background:none;

    border:none;

    color:white;

    font-size:24px;

    cursor:pointer;

    transition:.3s ease;

}


#hamburger_Btn:hover{

    transform:scale(1.1);

}





/* MOBILE */


@media(max-width:600px){


    #nav_bar{

        justify-content:flex-start;

    }


    #hamburger_Btn{

        display:block;

    }



    #links{


        position:absolute;

        top:50px;

        left:0;


        width:100%;


        background:lightslategray;


        display:flex;

        flex-direction:column;


        gap:0;


        transform:translateX(-100%);


        opacity:0;


        visibility:hidden;


        pointer-events:none;



        transition:


        transform .45s cubic-bezier(.22,1,.36,1),

        opacity .3s ease,

        visibility .45s;



    }




    #links a{


        width:100%;


        padding:15px 20px;





        opacity:0;


        transform:translateX(-20px);



        transition:

        transform .35s ease,

        opacity .35s ease;



    }



    /* OPEN MENU */


    #links.open{


        transform:translateX(0);


        opacity:1;


        visibility:visible;


        pointer-events:auto;


    }



    /* LINK ANIMATION */


    #links.open a{

        opacity:1;

        transform:translateX(0);

    }



    #links.open a:nth-child(1){

        transition-delay:.05s;

    }


    #links.open a:nth-child(2){

        transition-delay:.1s;

    }


    #links.open a:nth-child(3){

        transition-delay:.15s;

    }


    #links.open a:nth-child(4){

        transition-delay:.2s;

    }


    #links.open a:nth-child(5){

        transition-delay:.25s;

    }


}



</style>

</head>


<body>


<nav id="nav_bar">


<button id="hamburger_Btn">

<i class="fa-solid fa-bars"></i>

</button>



<div id="links">


<a href="#">Home</a>

<a href="#">About</a>

<a href="#">Services</a>

<a href="#">Contact</a>

<a href="#">Profile</a>


</div>


</nav>




<script>


// Get hamburger button

const hamburger_Btn = document.getElementById("hamburger_Btn");


// Get navigation links

const links = document.getElementById("links");


// Get hamburger icon

const icon = hamburger_Btn.querySelector("i");




// Open and close menu

hamburger_Btn.addEventListener("click",()=>{


    links.classList.toggle("open");


    // Change hamburger icon

    if(links.classList.contains("open")){


        icon.classList.remove("fa-bars");

        icon.classList.add("fa-xmark");


    }

    else{


        icon.classList.remove("fa-xmark");

        icon.classList.add("fa-bars");


    }



});



</script>


</body>
</html>
