<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <script src="https://kit.fontawesome.com/b160e75569.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Google Sans;
        }

        #container {
            width: 500px;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 30vh;
            background-color: antiquewhite;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        button {
            height: 50px;
            width: 50px;
            border-radius: 25px;
            border: none;
            color: white;
            transition:
                transform .2s ease,
                box-shadow .2s ease;
            font-weight: bold;
        }

        button:hover {
            cursor: pointer;
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(0,0,0,.25);
        }

        #increase {
            background-color: blue;
        }
        #decrease {
            background-color: red;
        }
        #reset {
            background-color: green;
        }

    

    </style>

</head>
<body>
    <div id="container">
        <div class="count">

            <h1>
                Count: <span id="count">0</span>
            </h1>
        
        </div>
        <div class="control">

            <button id="increase">
                +1
            </button>
            <button id="decrease">
                -1
            </button>
            <button id="reset">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
        
        </div>
    </div>

    <script>
        // Get the DOM elements
        const count = document.getElementById('count');
        const increase = document.getElementById('increase');
        const decrease = document.getElementById('decrease')
        const reset = document.getElementById('reset');

        // Make the count a number value
        let countValue = count.innerText;
        countValue = Number(countValue);

        // Funcitons
        increase.onclick = function increase() {
            countValue++;
            count.innerText = countValue;
        }

        decrease.onclick = function decrease() {
            countValue--;
            count.innerText = countValue;
        }

        reset.onclick = function reset() {
            countValue = 0;
            count.innerText = countValue;
        }

       

    </script>
</body>
</html>
