<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stop Watch</title>

    <link rel="stylesheet" href="styles.css">

<script src="https://kit.fontawesome.com/b160e75569.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">




</head>
<body>

<div class="stop_watch">

    <div class="screen">

        <div class="clock">

            <div class="time_box">
                <div id="hr" class="number">
                    00
                </div>
                <div class="label">
                    HR
                </div>
            </div>



            <div class="time_box">

                <div id="min" class="number">
                    00
                </div>
                <div class="label">
                    MIN
                </div>
            </div>

            <div class="time_box">
                <div id="s" class="number">
                    00
                </div>
                <div class="label">
                    SEC
                </div>
            </div>

            <div class="time_box">
                <div id="ms" class="number milliseconds">
                    000
                </div>

                <div class="label">
                    MS
                </div>
            </div>
        </div>
    </div>

    <div class="controls">

        <button id="start">
            <i class="fa-solid fa-play"></i>
        </button>

        <button id="pause">
            <i class="fa-solid fa-pause"></i>
        </button>
        <button id="reset">
            <i class="fa-solid fa-arrow-rotate-left"></i>
        </button>
    </div>
</div>

<script>
// Get buttons
const start = document.getElementById("start");
const reset = document.getElementById("reset");
const pause = document.getElementById("pause");

// Get clock elements
const hr = document.getElementById("hr");
const min = document.getElementById("min");
const s = document.getElementById("s");
const ms = document.getElementById("ms");

// Stores total elapsed milliseconds
let milliseconds = 0;

// Stores interval ID
let intervalId = null;

// Function that updates the stopwatch
function timer(){
    // Add 10 milliseconds
    milliseconds += 10;
    // Convert milliseconds into time units
    let hours = Math.floor(milliseconds / 3600000);
    let minutes = Math.floor(
        (milliseconds % 3600000) / 60000
    );
    let seconds = Math.floor(
        (milliseconds % 60000) / 1000
    );
    // Update screen
    hr.innerText = String(hours).padStart(2,"0");
    min.innerText = String(minutes).padStart(2,"0");
    s.innerText = String(seconds).padStart(2,"0");
    ms.innerText = String(milliseconds % 1000).padStart(3,"0");
}

// START BUTTON
start.onclick = function(){
    // Prevent multiple intervals
    if(intervalId === null){
        intervalId = setInterval(timer,10);
    }
};
//  Pause BUTTON

pause.onclick = function() {
    clearInterval(intervalId);
    intervalId = null;

}

// RESET BUTTON

reset.onclick = function(){
    // Stop timer

    clearInterval(intervalId);
    // Allow restarting

    intervalId = null;
    // Reset value
    milliseconds = 0;

    // Reset display

    hr.innerText = "00";
    min.innerText = "00";
    s.innerText = "00";
    ms.innerText = "000";

};



</script>


</body>
</html>
